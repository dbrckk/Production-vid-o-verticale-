name: Proof render - Earthquake documentary with live English narration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earthquake-proof.yml'
      - 'kinetic.py'
      - 'geology_premium.py'
      - 'universal.py'
      - 'cinematic.py'
      - 'qa_video.py'
      - 'motion_layers.py'
      - 'studio.py'
      - 'narration.py'
      - 'subtitle_design.py'
      - 'audio_mastering.py'
      - 'soundscape.py'
permissions:
  contents: read
concurrency:
  group: earthquake-documentary-quality-check
  cancel-in-progress: true
jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and English neural narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Compose and render an actual physical-motion documentary
        run: |
          python generate_topic.py --topic "What causes earthquakes?" --output output/earthquake-topic.json
          python studio.py --config output/earthquake-topic.json \
            --narrate --tts-provider edge --tts-voice en-US-BrianMultilingualNeural \
            --width 540 --fps 15 --preview --output output/earthquake-proof.mp4
      - name: Verify spoken English, motion category, word cues and audio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('output/earthquake-proof.json').read_text())
          assert cfg['mode']=='universal'
          assert cfg['voice']['language']=='en'
          assert cfg['voice']['voice']=='en-US-BrianMultilingualNeural'
          assert cfg['voice']['word_alignment']=='provider_word_boundaries'
          assert cfg['voice']['delivery_style']=='continuous_documentary'
          assert cfg['width']==540 and cfg['height']==960
          assert len(cfg['word_cues'])>=50
          assert len(cfg['scenes'])==6
          assert Path('output/earthquake-proof.mp4').stat().st_size>80000
          print('English neural documentary, active earthquake diagram and captions: PASS')
          PY
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 output/earthquake-proof.mp4
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          data=json.loads(Path('output/earthquake-proof.json').read_text())
          assert data['audio_mastering']['music_ducking']=='voice_sidechain'
          probe=json.loads(subprocess.run([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','json','output/earthquake-proof.mp4'
          ],check=True,capture_output=True,text=True).stdout)
          actual=float(probe['format']['duration'])
          expected=float(data['duration'])
          assert abs(actual-expected)<.25,(actual,expected)
          audio=json.loads(subprocess.run([
              'ffprobe','-v','error','-select_streams','a:0',
              '-show_entries','stream=sample_rate,codec_name','-of','json',
              'output/earthquake-proof.mp4'
          ],check=True,capture_output=True,text=True).stdout)['streams']
          assert len(audio)==1 and audio[0]['sample_rate']=='48000',audio
          print('Neural English voice, full duration and adaptive soundtrack: PASS')
          PY
      - name: Reject silent, static or badly synced finished videos
        run: |
          python qa_video.py --video output/earthquake-proof.mp4 \
            --manifest output/earthquake-proof.json \
            --report output/earthquake-quality.json
      - name: Downloadable review footage and synchronized cue manifest
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: english-earthquake-real-motion-neural-voice
          path: |
            output/earthquake-proof.mp4
            output/earthquake-proof.json
            output/earthquake-proof.voice.wav
            output/earthquake-topic.json
            output/earthquake-quality.json
            output/cover.png
          retention-days: 7
