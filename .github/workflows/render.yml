name: Render vertical science video
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Custom opening title (leave blank for default)'
        type: string
        required: false
      mode:
        description: 'preset = existing animations, custom = any topic, random_news = recent sourced news'
        type: choice
        required: true
        default: 'random_news'
        options: ['preset', 'custom', 'random_news', 'article_url']
      custom_topic:
        description: 'For custom mode: the subject of your video'
        type: string
        required: false
      article_url:
        description: 'For article_url mode: exact news link from the news picker'
        type: string
        required: false
      subject:
        description: 'Video storyboard'
        type: choice
        required: true
        default: 'sun-vanished'
        options: ['sun-vanished', 'paper-to-moon']
      quality:
        description: 'Choose output resolution'
        type: choice
        required: true
        default: '1080p'
        options: ['1080p', '720p', 'preview']
  push:
    branches: [main]
    paths: ['studio.py', 'storyboard.py', 'universal.py', 'topic_engine.py', 'generate_topic.py', 'webapp.py', 'web/**', 'presets/**', 'requirements.txt', 'tests/**', '.github/workflows/render.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Tests, static JavaScript syntax and playable smoke video
        run: |
          python -m pytest tests/ -q
          node --check hf_space/app.js
      - name: Render completed vertical MP4
        if: github.event_name == 'workflow_dispatch'
        env:
          TITLE: ${{ inputs.title }}
          QUALITY: ${{ inputs.quality }}
          SUBJECT: ${{ inputs.subject }}
          MODE: ${{ inputs.mode }}
          CUSTOM_TOPIC: ${{ inputs.custom_topic }}
          ARTICLE_URL: ${{ inputs.article_url }}
        run: |
          case "${QUALITY:-1080p}" in
            preview) WIDTH=540 ;;
            720p) WIDTH=720 ;;
            *) WIDTH=1080 ;;
          esac
          case "${MODE:-random_news}" in
            preset)
              CONFIG="presets/${SUBJECT:-sun-vanished}.json"
              test -f "$CONFIG"
              ;;
            custom)
              test -n "$CUSTOM_TOPIC" || { echo 'A topic is required for custom mode' >&2; exit 1; }
              python generate_topic.py --topic "$CUSTOM_TOPIC" --output output/topic.json
              CONFIG='output/topic.json'
              ;;
            random_news)
              python generate_topic.py --random-news --output output/topic.json
              CONFIG='output/topic.json'
              ;;
            article_url)
              test -n "$ARTICLE_URL" || { echo 'An article_url is required' >&2; exit 1; }
              python generate_topic.py --article-url "$ARTICLE_URL" --output output/topic.json
              CONFIG='output/topic.json'
              ;;
            *) echo 'Invalid mode' >&2; exit 1 ;;
          esac
          if [ -n "$TITLE" ]; then
            python studio.py --config "$CONFIG" --output output/science.mp4 --width "$WIDTH" --title "$TITLE"
          else
            python studio.py --config "$CONFIG" --output output/science.mp4 --width "$WIDTH"
          fi
      - name: Validate output video and audio
        if: github.event_name == 'workflow_dispatch'
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of default=noprint_wrappers=1 output/science.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 output/science.mp4
          test -s output/science.mp4
          test -s output/cover.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: vertical-science-${{ inputs.mode || 'custom' }}-${{ inputs.quality || '1080p' }}
          path: |
            output/science.mp4
            output/science.json
            output/cover.png
            output/topic.json
          retention-days: 14
